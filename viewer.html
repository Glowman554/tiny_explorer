<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDS Rect Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            pointer-events: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease;
        }

        .panel-header {
            font-weight: bold;
            font-size: 14px;
            color: #0f0;
            cursor: grab;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-header:active {
            cursor: grabbing;
        }

        #ui { top: 45px; left: 10px; width: 220px; max-height: calc(90vh - 35px); }

        #circuitMonitor { top: 10px; right: 10px; width: 280px; max-height: 45vh; }
        #vgaMonitor { top: 48vh; right: 10px; width: 280px; max-height: 45vh; }
        
        #logPanel {
            bottom: 10px; right: 10px;
            width: 600px;
            max-height: 300px;
        }



        .panel-content {
            overflow-y: auto;
            overflow-x: hidden;
        }

        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin: 4px 0 2px 0; color: #aaa; text-transform: uppercase; }
        
        select { width: 100%; background: #1a1a1a; color: #eee; border: 1px solid #444; padding: 4px; font-size: 12px; }
        button { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 6px 8px; cursor: pointer; margin-top: 5px; width: 100%; border-radius: 4px; font-size: 12px; }
        button:hover { background: #3a3a3a; border-color: #666; }
        
        .layer-toggle { display: flex; align-items: center; font-size: 12px; color: #eee; text-transform: none; padding: 2px 0; }
        .layer-toggle input { margin-right: 8px; }
        .layer-color { width: 12px; height: 12px; display: inline-block; margin-right: 8px; border-radius: 2px; cursor: pointer; }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; pointer-events: none; z-index: 1000; }
        
        #logContainer {
            font-family: 'JetBrains Mono', 'Fira Code', monospace; 
            font-size: 11px;
            white-space: pre;
            color: #0f0;
            margin: 0;
        }

        #netSearch {
            width: 100%; background: #1a1a1a; color: #eee; border: 1px solid #444; 
            padding: 6px; margin-bottom: 5px; box-sizing: border-box; border-radius: 4px;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
            margin: 12px 0;
            display: block;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #111;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            transform: scale(1.1);
        }
        
        #btnLogTab {
            position: absolute; bottom: 10px; right: 10px; width: auto; z-index: 1001; 
            padding: 4px 15px; background: rgba(0,0,0,0.85); border: 1px solid #444; 
            border-radius: 4px; color: #0f0; font-family: monospace; font-size: 12px; 
            font-weight: bold; cursor: pointer;
        }
        #btnLogTab:hover { background: #222; border-color: #0f0; }
        
        .monitor-controls { display: flex; gap: 5px; margin-bottom: 12px; }
        .monitor-controls button { flex: 1; margin-top: 0; }

        .monitor-special-row { display: flex; gap: 4px; margin-bottom: 10px; }
        .monitor-special-btn { 
            flex: 1; padding: 6px 0; font-size: 10px; text-align: center; border-radius: 4px; 
            background: #222; border: 1px solid #444; color: #888; cursor: pointer; font-family: monospace;
            transition: all 0.1s;
        }
        .monitor-special-btn.state-low { background: #112; color: #58a6ff; border-color: #235; }
        .monitor-special-btn.state-high { background: #321; color: #ffa658; border-color: #642; }

        .monitor-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
        .monitor-btn { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            font-size: 10px; font-weight: bold; border-radius: 4px; border: 1px solid #444;
            background: #222; color: #666; cursor: pointer; transition: all 0.1s;
        }
        .monitor-btn.state-low { background: #112; color: #58a6ff; border-color: #235; }
        .monitor-btn.state-high { background: #321; color: #ffa658; border-color: #642; }
        .monitor-btn.state-flipped { background: #440; color: #ff0; border-color: #ff0; box-shadow: 0 0 5px rgba(255, 255, 0, 0.4); }
        .monitor-special-btn.state-flipped { background: #440; color: #ff0; border-color: #ff0; box-shadow: 0 0 5px rgba(255, 255, 0, 0.4); }
        .monitor-group-label { font-size: 9px; color: #555; text-transform: uppercase; margin-bottom: 4px; margin-top: 8px; }
        
        .dual-slider-container {
            position: relative;
            width: 100%;
            height: 30px;
            margin-top: 5px;
        }
        .dual-slider-track {
            position: absolute;
            top: 13px;
            left: 0;
            right: 0;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }
        .dual-slider-fill {
            position: absolute;
            top: 13px;
            height: 4px;
            background: #0f0;
            border-radius: 2px;
        }
        .dual-slider-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            pointer-events: none;
            margin: 0;
            height: 30px;
        }
        .dual-slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            pointer-events: auto;
            width: 14px;
            height: 14px;
            background: #0f0;
            border-radius: 50%;
            border: 2px solid #111;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            position: relative;
            z-index: 3;
        }
        .dual-slider-input::-webkit-slider-thumb:hover {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            transform: scale(1.1);
        }
        
        .layer-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            color: #eee;
            padding: 2px 6px;
            margin: 2px;
            background: #222;
            border-radius: 4px;
            border: 1px solid #444;
            transition: opacity 0.2s, background 0.2s;
        }
        .layer-badge.hidden-layer {
            opacity: 0.3;
            background: transparent;
        }
        .layer-badge .layer-color {
            width: 10px; height: 10px; margin-right: 4px; border-radius: 2px;
        }
        
        /* Hide scrollbars but keep functionality */
        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <canvas id="glcanvas"></canvas>

    <div id="topMenu" style="position: absolute; top: 10px; left: 10px; z-index: 1000; display: flex; gap: 5px;">
        <button id="toggleUiBtn" style="background: #2a2a2a; color: #0f0; border-color: #0f0; width: auto; margin: 0; padding: 4px 10px;">Controls</button>
        <button id="toggleMonitorBtn" style="background: #2a2a2a; border-color: #444; color: #888; width: auto; margin: 0; padding: 4px 10px;">Monitor</button>
        <button id="toggleVgaBtn" style="background: #2a2a2a; border-color: #444; color: #888; width: auto; margin: 0; padding: 4px 10px;">VGA</button>
        <button id="toggleLogBtn" style="background: #2a2a2a; border-color: #444; color: #888; width: auto; margin: 0; padding: 4px 10px;">Log</button>
    </div>

    <div id="ui" class="panel">
        <div class="panel-header">Controls</div>
        <div class="panel-content">
            <div class="control-group">
                <button id="btnReset">Reset View</button>
            </div>
            <div class="control-group">
                <label>Highlight Trees</label>
                <input type="text" id="treeSearch" placeholder="Search tree...">
                <select id="treeSelect" size="10" multiple></select>
                <input type="text" id="treeIdList" placeholder="Tree IDs (e.g. 1, 2, 5-10)" style="width: 100%; background: #1a1a1a; color: #eee; border: 1px solid #444; padding: 6px; margin-top: 5px; box-sizing: border-box; border-radius: 4px; font-family: monospace; font-size: 11px;">
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <button id="btnHighlightIds" style="margin-top: 0; flex: 1;">Highlight IDs</button>
                    <button id="btnClearTrees" style="margin-top: 0; flex: 1;">Clear</button>
                </div>
            </div>
            <div class="control-group">
                <label>Layers / State</label>
                <input type="range" id="stateMixSlider" min="0" max="1" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label>Global Opacity</label>
                <input type="range" id="alphaSlider" min="0.1" max="1.0" step="0.1" value="0.8">
            </div>
            <div class="control-group">
                <label>Perspective</label>
                <input type="range" id="perspSlider" min="0.0" max="1.0" step="0.01" value="0.5">
            </div>
            <div class="control-group">
                <label>Explode Layers</label>
                <input type="range" id="explodeSlider" min="1.0" max="20.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>Rendering Mode</label>
                <select id="renderModeSelect">
                    <option value="cube" selected>Cube (3D)</option>
                    <option value="quad">Quad (2D Opt)</option>
                </select>
            </div>
            <div class="control-group">
                <div class="layer-toggle">
                    <input type="checkbox" id="boundaryToggle"> <span>Boundaries</span>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="powerNetToggle" checked> <span>Power Nets</span>
                </div>
            </div>
            <div class="control-group">
                <label>Animation</label>
                <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                    <button id="btnCaptWp" style="margin-top: 0; flex: 1;">Capture</button>
                    <button id="btnClearWp" style="margin-top: 0; flex: 1;">Clear</button>
                </div>
                <div>
                    <label>Transition (s)</label>
                    <input type="number" id="animTime" value="2.0" step="0.5" min="0.5" style="width: 100%; background: #1a1a1a; color: #eee; border: 1px solid #444; padding: 4px; box-sizing: border-box; border-radius: 4px; font-size: 11px;">
                </div>
                <button id="btnPlayAnim" style="margin-top: 8px; background: #284; border-color: #3a5;">Play Sequence</button>
                <div id="wpList" style="font-size: 10px; color: #888; margin-top: 8px; max-height: 60px; overflow-y: auto; border-top: 1px solid #333; padding-top: 4px;">
                    0 Waypoints
                </div>
            </div>
            <div class="control-group">
                <label>Layer Z-Range</label>
                <div class="dual-slider-container">
                    <div class="dual-slider-track"></div>
                    <div class="dual-slider-fill" id="layerRangeFill"></div>
                    <input type="range" class="dual-slider-input" id="layerMinIdx" min="0" max="1" value="0">
                    <input type="range" class="dual-slider-input" id="layerMaxIdx" min="0" max="1" value="1">
                </div>
                <div id="layerList" style="margin-top: 8px; display: flex; flex-wrap: wrap;"></div>
            </div>
        </div>
    </div>



    <div id="circuitMonitor" class="panel">
        <div class="panel-header">Circuit Monitoring</div>
        <div class="panel-content" id="circuitControls" style="border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; display: none;">
            <div style="display: flex; gap: 5px; align-items: center;">
                <button id="btnStepWave" style="background: #284; border-color: #3a5; padding: 4px 10px; flex: 0">Step Wave</button>
                <div style="display: flex; align-items: center; gap: 5px; flex: 1; justify-content: flex-end;">
                    <label style="font-size: 10px; color:#ccc;">Auto:</label>
                    <input type="checkbox" id="autoStepToggle">
                    <input type="range" id="autoStepSpeed" min="1" max="100" value="10" style="width: 60px;" title="Speed">
                </div>
            </div>
        </div>
        <div id="circuitMonitorContent" class="panel-content" style="padding-top: 0;">
            <div style="padding:10px; color:#666;">Waiting for netlist...</div>
        </div>
    </div>

    <div id="vgaMonitor" class="panel">
        <div class="panel-header">VGA Monitor</div>
        <div id="vgaMonitorContent" class="panel-content">
            <div class="monitor-controls" style="margin-top: 10px;">
                <button id="btnVgaInit">Init VGA</button>
                <button id="btnVgaStep">Tick 1k</button>
                <button id="btnVgaRun">Run Continuous</button>
            </div>
            <div style="background:#000; border-radius:4px; margin-top:10px; overflow:hidden; border: 1px solid #222;">
                <canvas id="vgaCanvas" style="width:100%; height:auto; image-rendering:pixelated; display:none;"></canvas>
                <div id="vgaPlaceholder" style="padding:40px; text-align:center; color:#444; font-size:12px;">VGA not initialized</div>
            </div>
        </div>
    </div>

    <div id="logPanel" class="panel">
        <div class="panel-header">System Log</div>
        <div class="panel-content" style="max-height: 250px;">
            <pre id="logContainer"></pre>
        </div>
    </div>

    <script type="module" src="web/main.js"></script>
</body>
</html>
