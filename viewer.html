<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDS Rect Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8); padding: 10px;
            border-radius: 8px; max-height: 90vh; overflow-y: auto;
            border: 1px solid #444; pointer-events: auto;
            min-width: 200px;
        }
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; margin: 2px 0; cursor: pointer; }
        select { width: 100%; background: #222; color: #eee; border: 1px solid #555; padding: 4px; }
        button { background: #333; color: #eee; border: 1px solid #555; padding: 4px 8px; cursor: pointer; margin-top: 5px; width: 100%; }
        button:hover { background: #444; }
        h3 { margin: 0 0 10px 0; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .layer-toggle { display: flex; align-items: center; }
        .layer-toggle input { margin-right: 8px; }
        .layer-color { width: 12px; height: 12px; display: inline-block; margin-right: 5px; border-radius: 2px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; pointer-events: none; }
        #logContainer {
            position: absolute; bottom: 45px; right: 10px;
            background: rgba(0, 0, 0, 0.9); padding: 10px;
            border-radius: 8px; border: 1px solid #444;
            max-height: 300px; overflow-y: auto; overflow-x: auto;
            width: 600px;
            font-family: monospace; font-size: 11px;
            white-space: pre;
            color: #0f0; z-index: 1000;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transform: scale(0);
            transform-origin: bottom right;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.4s ease, 
                        visibility 0s 0.4s;
        }
        #logContainer.visible { 
            opacity: 1; 
            visibility: visible; 
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), 
                        opacity 0.3s ease, 
                        visibility 0s;
        }
        #netSearch {
            width: 100%; background: #222; color: #eee; border: 1px solid #555; 
            padding: 4px; margin-bottom: 5px; box-sizing: border-box;
        }
        #alphaSlider { width: 100%; }
        #btnLogTab {
            position: absolute; bottom: 10px; right: 10px; width: auto; z-index: 1001; 
            padding: 4px 10px; background: rgba(0,0,0,0.8); border: 1px solid #444; 
            border-radius: 4px; color: #0f0; font-family: monospace; font-size: 12px; 
            font-weight: bold; cursor: pointer;
        }
        #btnLogTab:hover { background: rgba(30, 30, 30, 0.9); border-color: #666; }
        
        #circuitMonitor {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.85); padding: 12px;
            border-radius: 8px; border: 1px solid #444;
            width: 280px; max-height: 400px; overflow-y: auto;
            pointer-events: auto; font-size: 13px;
        }
        .monitor-header { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; color: #0f0; }
        .monitor-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .wire-name { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .wire-state { 
            width: 30px; height: 20px; line-height: 20px; text-align: center;
            border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: all 0.2s;
        }
        .state-low { background: #300; color: #f00; border: 1px solid #600; }
        .state-high { background: #030; color: #0f0; border: 1px solid #060; }
        .state-x { background: #330; color: #ff0; border: 1px solid #660; }
        .monitor-controls { display: flex; gap: 5px; margin-bottom: 10px; }
        .monitor-controls button { flex: 1; padding: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <canvas id="glcanvas"></canvas>
    <div id="ui">
        <h3>Controls</h3>
        <div class="control-group">
            <button id="btnReset">Reset View</button>
        </div>
        <div class="control-group">
            <label>Nets (by Area)</label>
            <input type="text" id="netSearch" placeholder="Search net...">
            <select id="netSelect" size="15" multiple style="width:100%"></select>
            <button id="btnClearNet">Clear Highlight</button>
        </div>
        <div class="control-group">
            <label>Layer Opacity</label>
            <input type="range" id="alphaSlider" min="0.1" max="1.0" step="0.1" value="0.8">
        </div>
        <div class="control-group">
            <label class="layer-toggle">
                <input type="checkbox" id="boundaryToggle"> Draw Boundaries
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="powerNetToggle" checked> Show Power Nets (0, 1)
            </label>
        </div>
        <div class="control-group">
            <h3>Layers</h3>
            <button id="btnToggleAll">Toggle All Layers</button>
            <div id="layerList"></div>
        </div>

    </div>
    <div id="circuitMonitor"></div>
    <pre id="logContainer"></pre>
    <button id="btnLogTab">LOG</button>

<script src="web/viewer.js"></script>
</body>
</html>
